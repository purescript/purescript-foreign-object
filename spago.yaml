package:
  name: foreign-object
  description: Functions for working with homogeneous JavaScript objects
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 4.1.1
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-foreign-object
  dependencies:
    - arrays: ">=7.0.0 <8.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - gen: ">=4.0.0 <5.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - st: ">=6.0.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - ordered-collections: ">=3.0.0 <4.0.0"
      - partial: ">=4.0.0 <5.0.0"
      - quickcheck: ">=8.0.1 <9.0.0"
      - transformers: ">=6.0.0 <7.0.0"
workspace: {}
